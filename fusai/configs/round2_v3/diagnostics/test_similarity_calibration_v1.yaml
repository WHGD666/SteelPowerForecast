diagnostic_version: round2_v3_test_similarity_calibration_1
status: preregistered
experiment_role: diagnostic
task: calibrate_validation_to_october_covariate_shift
control_artifact_id: official_platform_probe_triplet_v1
hypothesis: >-
  Process-state similarity to the unlabeled October test origins identifies why
  recent unweighted OOF gains failed to transfer to the official platform.

features:
  manifest: manifests/round2_v3/origin_features_v1.json
  registry: data/prepared/round2_v3_origin_features_1/feature_registry.csv
  allowed_transforms: [current, rolling_60m_mean, rolling_720m_mean, current_state_indicator]
  forbidden_transforms: [calendar]
  target_history_allowed: false
  future_observations_allowed: false

domain_model:
  family: logistic_regression
  class_weight: balanced
  C: 1.0
  max_iter: 2000
  random_state: 42
  grouped_cv_splits: 5
  group_unit: calendar_day

weighting:
  probability_clip: [0.05, 0.95]
  normalized_odds_clip: [0.25, 4.0]
  normalize_within_fold: true
  top_similarity_fraction: 0.25

validation:
  fold_ids: [wf_03_bf3_active, wf_04_late_september, wf_05_holder1_active]
  actual_floor: 0.000001

platform_probes:
  dynamic_fuel_g1:
    oof: outputs/round2_v3/dynamic_fuel_runs/20261004T070858Z_dynamic_fuel_g1_31e2a08193/oof_predictions.csv
    sha256: 45962738eab80b0291a21135f14c74c4ce86ae0d0b08d37eea95ee05397aa007
    control_variant: control
    candidate_variant: blend_dynamic70_control30
    actual_column: actual
    official_score_delta: -0.6551
    expected_weighted_direction: negative
  shared_g1:
    oof: outputs/round2_v3/shared_horizon_runs/20261004T122856Z_long_g1_shared_85d58617c3/oof_predictions.csv
    sha256: 464c5628302e78c1bba2d42f576e9804559cd2c3d7e0e9a24c5e0e996fef7ced
    control_variant: v28_per_horizon_control
    candidate_variant: shared_horizon_tree
    actual_column: actual_interval_mean
    official_score_delta: -0.3577
    expected_weighted_direction: negative
  shared_gall:
    oof: outputs/round2_v3/long_gall_shared_runs/20261004T125203Z_long_gall_shared_c83510959a/oof_predictions.csv
    sha256: 02c73da5ec393539c5d75145b3d92eda86ab8cb327856be8775b4664b38660e6
    control_variant: v20_per_horizon_control
    candidate_variant: v20_shared_horizon_tree
    actual_column: actual_interval_mean
    official_score_delta: -0.0082
    expected_weighted_direction: neutral

calibration_gate:
  negative_max_gain_pct: 0.0
  neutral_max_absolute_gain_pct: 0.15
  minimum_fold_effective_sample_fraction: 0.30
  require_all_three_platform_directions: true

output:
  root: outputs/round2_v3/test_similarity_runs
  append_registry: true

