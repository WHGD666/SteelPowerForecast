diagnostic_version: round2_v3_holder2_inverse_confirm_1
status: preregistered
experiment_role: diagnostic
task: holder2_inverse_pressure_confirmation
control_artifact_id: external_v29b_63_4621
hypothesis: >-
  The INVERSE of the failed D-078 direction, observed post hoc but consistently
  across all four development blocks: high fold-local holder-2 boundary pressure
  predicts that the shared-horizon tree control over-predicts far-horizon
  generator_1 (positive actual-minus-prediction residuals), because near-boundary
  gas-holder states lead future generation curtailment by hours.
primary_change: >-
  rebuild the frozen shared-horizon LightGBM control on four fresh ten-day
  pseudo-test blocks never used in any prior analysis or hypothesis development,
  then measure the preregistered inverse boundary-pressure relationship on the
  rebuilt residuals; train no correction model and create no submission.
holdout_evaluated: false
submission_eligible: false

