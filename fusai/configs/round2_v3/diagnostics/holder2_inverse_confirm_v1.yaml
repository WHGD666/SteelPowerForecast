tree_features:
  - bf_production_total__level
  - bf_production_total__delta_2h
  - bf_production_total__delta_6h
  - bf_production_total__std_4h
  - bf_user_total__level
  - bf_user_total__delta_2h
  - bf_user_total__delta_6h
  - generator_fuel_total__level
  - generator_fuel_total__delta_1h
  - generator_fuel_total__delta_4h
  - generator_fuel_total__std_4h
  - generator_bf_fuel__level
  - generator_bf_fuel__delta_2h
  - generator_converter_fuel__level
  - holder_2__level
  - holder_2__delta_2h
  - holder_2__delta_6h
  - holder_2__std_4h
  - bf_balance_proxy__level
  - balance_proxy_total__delta_2h
  - balance_proxy_total__std_4h

tree_control:
  library_origin_stride_minutes: 60
  lightgbm:
    objective: regression_l1
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    random_state: 20261005
    n_jobs: -1
    verbosity: -1
    deterministic: true
    force_col_wise: true
    sample_weight: inverse_absolute_target
    sample_weight_floor: 1.0

boundary_contract:
  required_columns:
    - holder_2__level
    - holder_2__delta_1h
    - holder_2__delta_4h
    - holder_2__delta_12h
    - balance_proxy_total__level
  reference_quantiles: [0.05, 0.95]
  zone_quantiles: [0.10, 0.90]
  maximum_dwell_steps: 96
  robust_scale_floor: 1.0e-6
  score_weights:
    centered_position: 0.45
    multiscale_velocity: 0.25
    signed_boundary_dwell: 0.20
    gas_balance_state: 0.10
  score_extreme_quantiles: [0.25, 0.75]
  broad_parameter_search: false

inverse_diagnostic_gate:
  maximum_pooled_far_residual_spearman: -0.08
  maximum_positive_block_fraction: 0.25
  maximum_pooled_high_low_far_residual_spread_pct: -1.0
  maximum_positive_spread_block_fraction: 0.25
  maximum_pooled_target_change_spearman: -0.05
  maximum_positive_target_change_block_fraction: 0.25
  minimum_extreme_group_fraction_per_block: 0.05
  model_experiment_allowed_on_pass: true
  platform_submission_on_pass: false

budget:
  model_count: 4
  gpu_required: false
  user_runs_cpu_intensive_command: true

output:
  root: outputs/round2_v3/holder2_inverse_confirm_runs
  save_oof_predictions: true
  append_registry: true
  create_submission: false
