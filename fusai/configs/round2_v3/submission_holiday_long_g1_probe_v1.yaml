hypothesis: >-
  A conservative holiday-specific downward correction to the deployed v28
  generator_1 fuel component transfers from the independent Labor Day and
  Dragon Boat blocks to the October National Day target interval.
primary_change: >-
  change only v29b long generator_1 cells whose 15-minute target interval
  starts on 2025-10-01 through 2025-10-08 by scaling the September OLS fuel
  component from 1.00 to the preregistered fixed value 0.95.
known_risks:
  - the passed diagnostic evaluates a raw fuel proxy rather than the exact v29b out-of-fold prediction
  - National Day steel production and dispatch may not transfer from the two spring holiday blocks

