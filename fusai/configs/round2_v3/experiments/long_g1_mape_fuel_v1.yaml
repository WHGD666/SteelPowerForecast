experiment_version: round2_v3_long_g1_mape_fuel_1
status: preregistered
experiment_role: scientific
task: isolated_long_generator_1_mape_aligned_fuel_proxy
control_artifact_id: 20261004T092221Z_anomaly_weight_g1_e6563a0b55
hypothesis: >-
  Replacing the dominant v28 generator_1 September OLS fuel proxy with an
  inverse-target weighted median regression improves official MAPE while the
  exact tree predictions and deployed horizon blend stay frozen.
primary_change: >-
  only the fold-local September generator_1 fuel proxy changes from ordinary
  least squares to quantile=0.5, alpha=0 weighted median regression with
  sample weights proportional to 1/max(abs(y), 20 MW)
holdout_evaluated: false
submission_eligible: false

inputs:
  raw_train_tables:
    - data/raw/train/Semi_gas.csv
    - data/raw/train/Semi_gas_holder.csv
    - data/raw/train/Semi_gas_user.csv
    - data/raw/train/Semi_load.csv
  raw_fingerprints: manifests/round2_v3/data_fingerprints.json
  label_manifest: manifests/round2_v3/prepared_labels_v3.json
  split_manifest: manifests/round2_v3/splits_v3.json
  split_assignments: manifests/round2_v3/validation_origins_v3.csv
  event_episodes: manifests/round2_v3/step_event_episodes_v1.csv
  control_oof: outputs/round2_v3/anomaly_weight_runs/20261004T092221Z_anomaly_weight_g1_e6563a0b55/oof_predictions.csv
  control_oof_sha256: 672dc4ab36f1e2352826f44b3f2411a3d199b40078d5e3c856a0fddd36aeb917
  legacy_v28_source: legacy/junior_handover_20261001_optimal_bundle/source_snapshot/src/build_submission_semi_v28.py

experiment:
  target: generator_1
  control_variant: control_weight1
  candidate_variant: mape_median_fuel
  tree_recipe: v28_exact_frozen_from_control_oof
  fuel_recipe_control: september_ols
  fuel_recipe_candidate: september_inverse_target_weighted_median
  horizon_blend_recipe: v28_exact_0.8_near_0.6_far
  future_process_observations_allowed: false
  true_target_history_features_allowed: false
  platform_feedback_used_for_fit: false

validation:
  strategy: recent_walk_forward
  fold_ids: [wf_03_bf3_active, wf_04_late_september, wf_05_holder1_active]
  primary_label: official_interval_mean
  auxiliary_label: legacy_point
  random_split: false

training:
  fuel_fit_start: "2025-09-01 00:00:00"
  denominator_floor_mw: 20.0
  quantile: 0.5
  alpha: 0.0
  solver: highs
  normalize_sample_weight_mean: true

selection_gate:
  minimum_component_long_g1_accuracy_gain_pct: 0.30
  minimum_standalone_long_g1_accuracy_gain_pct: 0.80
  minimum_single_fold_gain_pct: 0.00
  maximum_ordinary_origin_accuracy_loss_pct: 0.10
  maximum_near_far_accuracy_loss_pct: 0.10
  maximum_short_accuracy_loss_pct: 0.10
  require_majority_episode_improvement: true

budget:
  fold_count: 3
  fuel_model_count: 3
  lightgbm_model_count: 0
  gpu_required: false

output:
  root: outputs/round2_v3/mape_fuel_runs
  save_oof_predictions: true
  append_registry: true
  create_submission: false

