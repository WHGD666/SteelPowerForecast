training:
  g1_tree_start: "2025-09-01 00:00:00"
  target_definition: legacy_point_at_origin_plus_horizon
  use_same_training_origin_contract_as_v28: true
  target_history_features_allowed: false
  future_process_observations_allowed: false
  global_tree_features:
    - horizon_minutes
    - horizon_step
    - target_hour_sin
    - target_hour_cos
    - target_minute_sin
    - target_minute_cos
    - target_dayofweek_sin
    - target_dayofweek_cos
    - target_is_weekend
    - target_month
    - target_day_of_month

fuel_recipe:
  columns: [generator_use_blast_furnace_gas, generator_use_coke_gas, generator_use_converter_gas]
  fit_start: "2025-09-01 00:00:00"
  near_horizon_max_minutes: 32
  near_weight: 0.8
  far_weight: 0.6

variants:
  control: v28_per_horizon_control
  promotion_candidate: shared_horizon_tree

lightgbm:
  objective: regression_l1
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 31
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: -1
  deterministic: true
  force_col_wise: true

selection_gate:
  minimum_component_long_g1_accuracy_gain_pct: 0.5
  minimum_standalone_long_g1_accuracy_gain_pct: 0.8
  minimum_single_fold_gain_pct: 0.0
  maximum_ordinary_origin_accuracy_loss_pct: 0.2
  maximum_near_far_accuracy_loss_pct: 0.2
  require_majority_episode_improvement: true

budget:
  fold_count: 3
  trained_model_variants: 1
  expected_model_count: 3
  gpu_required: false

output:
  root: outputs/round2_v3/shared_horizon_runs
  append_registry: true
  create_submission: false
