blend_contract:
  base_component: v29b
  alternate_component: v34
  mutable_target: generator_1
  frozen_target: generator_all
  allowed_weights: [0.0, 0.25, 0.5, 1.0]
  round_decimals: 6

platform_ladder:
  step_0: "submit anchor w_short=0.0, w_long=0.0"
  step_1: "submit w_short=0.0, w_long=0.5"
  if_step_1_improves: "test w_long=1.0; otherwise retain the better of 0.5 and 1.0"
  if_step_1_worsens: "test w_long=0.25 instead of 1.0"
  final_short_probe: "on the best long weight, test short weight 0.5; escalate to 1.0 only if it improves"

stop_conditions:
  - "anchor score is materially below its projected range; stop and audit the projection before blending"
  - "a changed candidate violates schema, time, finite-value or physical contracts"
  - "long weight 0.5 degrades the anchor; do not jump directly to weight 1.0"
  - "do not infer component scores from total score; only infer the direction of the single changed block"

