hypothesis: >-
  v29b freezes the best historically verified gall components, while v34 may
  improve generator_1; a convex blend can reduce the regime-transfer risk of
  replacing generator_1 outright.
primary_change: >-
  keep v29b generator_all exactly fixed and blend only generator_1 between
  v29b and v34, with independently declared short and long weights.

