experiment_version: round2_v3_short_g1_dynamic_fuel_1
status: preregistered
experiment_role: scientific
task: isolated_short_generator_1_dynamic_fuel
control_artifact_id: external_v29b_short_g1_v16_lineage
control_run_id: 20261004T102800Z_short_g1_restored_1fb7013867
hypothesis: >-
  The previously observed near-horizon dynamic-fuel signal improves the exact
  v16-lineage short generator_1 OOF control, even though its long-horizon
  platform probe failed under October distribution shift.
primary_change: >-
  replace 70 percent of the v16-lineage short generator_1 prediction with a
  fold-local horizon-specific causal fuel-history OLS prediction; retain 30
  percent of the exact v16 control prediction.
holdout_evaluated: false
submission_eligible: false

inputs:
  feature_manifest: manifests/round2_v3/origin_features_v1.json
  feature_registry: data/prepared/round2_v3_origin_features_1/feature_registry.csv
  label_manifest: manifests/round2_v3/prepared_labels_v3.json
  split_manifest: manifests/round2_v3/splits_v3.json
  split_assignments: manifests/round2_v3/validation_origins_v3.csv
  event_episodes: manifests/round2_v3/step_event_episodes_v1.csv
  control_manifest: outputs/round2_v3/short_g1_restored_runs/20261004T102800Z_short_g1_restored_1fb7013867/run_manifest.json
  control_oof: outputs/round2_v3/short_g1_restored_runs/20261004T102800Z_short_g1_restored_1fb7013867/oof_predictions.csv

scope:
  period: short
  target: generator_1
  control_variant: v16_legacy_columns
  fold_ids: [wf_03_bf3_active, wf_04_late_september, wf_05_holder1_active]
  horizons_minutes: [15, 30, 45, 60, 75, 90, 105, 120]
  generator_all_changed: false
  long_outputs_changed: false
  future_process_observations_allowed: false
  true_target_history_allowed: false

dynamic_fuel_features:
  origin_frequency_minutes: 15
  fuel_columns:
    - generator_use_blast_furnace_gas
    - generator_use_coke_gas
    - generator_use_converter_gas
  include_current: true
  lag_steps: [1, 4, 8, 16, 96]
  rolling_mean_steps: [4, 16, 96]
  target_calendar_columns:
    - target_hour_sin
    - target_hour_cos
    - target_minute_sin
    - target_minute_cos
    - target_dayofweek_sin
    - target_dayofweek_cos
    - target_is_weekend
    - target_month
    - target_day_of_month

training:
  recent_window_days: 21
  estimator: ordinary_least_squares
  median_imputation_fit_inside_fold: true
  standardization_fit_inside_fold: true

variants:
  diagnostic_dynamic_fuel_ols: 1.0
  promotion_candidate: blend_dynamic70_v16control30
  blend_dynamic70_v16control30:
    dynamic_fuel_weight: 0.70
    v16_control_weight: 0.30
  broad_blend_search: false

selection_gate:
  minimum_short_g1_accuracy_gain_pct: 1.0
  minimum_single_fold_gain_pct: -0.20
  minimum_single_horizon_gain_pct: -0.20
  maximum_ordinary_origin_accuracy_loss_pct: 0.20
  minimum_event_improvement_fraction: 0.50
  minimum_evaluated_event_count: 2
  platform_submission_on_pass: false

budget:
  fold_count: 3
  horizon_models_per_fold: 8
  expected_model_count: 24
  gpu_required: false
  user_runs_command: true

output:
  root: outputs/round2_v3/short_dynamic_fuel_runs
  append_registry: true
  create_submission: false
